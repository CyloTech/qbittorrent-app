app:
  display_name: qBittorrent
  publisher: qBittorrent
  description: BitTorrent client with a web interface.
image:
  name: repo.cylo.net/qbittorrent
  version: 5.2.4_2.0.15.0-1
  tag: 5.2.4_2.0.15.0-1
container:
  memory: 100
  memory_swap: 100
  memory_reservation: 4
  cpus: 0
  init: false
networking:
  is_web_app: true
  requires_domain: true
  subdomain: qbittorrent
  ssl: true
behavior:
  app_slots: 1
  expect_callback: true
  callback_requires_auth: false
  can_update: true
  allow_downgrade: true
  ssl_restart: false
ports:
  combined:
    dynamic: 2
custom_fields:
  ENABLE_VUETORRENT:
    label: Web interface
    type: selector
    required: false
    default_value: '0'
    description: Choose qBittorrent, VueTorrent or qui. qui starts with your Appbox login.
    params:
      menuItems:
        '0': qBittorrent
        '1': VueTorrent
        qui: qui
